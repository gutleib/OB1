version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ob1
      POSTGRES_USER: ob1
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ob1secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ob1 -d ob1"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server-python
    restart: unless-stopped
    ports:
      - "127.0.0.1:7981:7981"
    environment:
      DATABASE_URL: postgresql://ob1:${DB_PASSWORD:-ob1secret}@postgres:5432/ob1
      INFINITY_URL: ${INFINITY_URL:-http://host.docker.internal:7997}
      INFINITY_MODEL: ${INFINITY_MODEL:-deepvk/USER-bge-m3}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      OPEN_BRAIN_CITATION_BASE_URL: ${OPEN_BRAIN_CITATION_BASE_URL:-http://localhost:7981/thoughts}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
